# Default values for snappymail.
# This file is in YAML and uses Helm-style templating in deployment.yaml.

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  # Built and published by github.com/bkero/docker-snappymail.
  repository: ghcr.io/bkero/docker-snappymail
  # Defaults to .Chart.AppVersion if empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Replicas / update strategy
#
# This chart deploys SnappyMail stateless: /var/lib/snappymail is an emptyDir
# that is bootstrapped fresh on every container start, and configuration is
# layered in from a ConfigMap (config.*) and a Secret (admin.*) below.
#
# SnappyMail itself is not designed for clustered operation — sessions and
# file locking are best-effort, so running replicaCount > 1 is not advised
# unless you front it with sticky-session affinity.
# -----------------------------------------------------------------------------
replicaCount: 1

strategy:
  type: RollingUpdate

# -----------------------------------------------------------------------------
# Service account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Pod / container security
# -----------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  fsGroup: 82
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  # The container always listens on 8888.
  targetPort: 8888
  annotations: {}

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: 25m
  hosts:
    - host: mail.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: snappymail-tls
    #   hosts:
    #     - mail.example.com

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# -----------------------------------------------------------------------------
# SnappyMail configuration overlay
#
# These values are rendered into a ConfigMap, mounted at
# /etc/snappymail-overlay, and then copied into SnappyMail's data tree by
# the container's entrypoint at boot. Both fields are optional — leave them
# empty to let SnappyMail auto-bootstrap a default application.ini and
# manage domains via the admin UI.
#
# `applicationIni` is the literal contents of application.ini. See
# https://github.com/the-djmaze/snappymail/blob/master/snappymail/v/0.0.0/app/resources/settings/application.ini
# for the full reference.
#
# `domains` is a map of <name> -> JSON object describing one IMAP/SMTP
# domain. Each entry is written into _data_/_default_/domains/<name>.json.
# -----------------------------------------------------------------------------
config:
  applicationIni: ""
  #   [webmail]
  #   title = "My SnappyMail"
  #   loading_description = "SnappyMail"
  #
  #   [security]
  #   admin_login = "admin"
  #   ...

  domains: {}
  #   example.com:
  #     name: example.com
  #     IMAP:
  #       host: imap.example.com
  #       port: 993
  #       type: SSL/TLS
  #     SMTP:
  #       host: smtp.example.com
  #       port: 587
  #       type: STARTTLS
  #       auth: true

# -----------------------------------------------------------------------------
# Admin login + password
#
# `login` is injected as $SNAPPYMAIL_ADMIN_LOGIN; the entrypoint patches it
# into [security] admin_login of application.ini at boot.
#
# `password` is the cleartext admin password — it gets stored in a Secret,
# mounted at /etc/snappymail-secret/admin_password, then bcrypt-hashed by
# the entrypoint and patched into [security] admin_password.
#
# To use an externally-managed Secret instead (recommended for production
# so the cleartext never lives in your values file), set `existingSecret`
# to the Secret name and `existingSecretKey` to the key inside it that
# holds the cleartext password.
#
# When neither `password` nor `existingSecret` is set, the container falls
# back to its first-boot behavior: it generates a random password and
# writes it to /var/lib/snappymail/_data_/_default_/admin_password.txt
# inside the (ephemeral) emptyDir. NOTES.txt explains how to recover it.
# -----------------------------------------------------------------------------
admin:
  login: ""
  password: ""
  existingSecret: ""
  existingSecretKey: "admin_password"

# -----------------------------------------------------------------------------
# SnappyMail / runtime tunables exposed as environment variables.
# These are consumed by the container's entrypoint.sh.
# -----------------------------------------------------------------------------
env:
  UPLOAD_MAX_SIZE: "25M"
  MEMORY_LIMIT: "128M"
  PHP_TIMEZONE: "UTC"
  PHP_FPM_PM: "ondemand"
  PHP_FPM_MAX_CHILDREN: "30"
  PHP_FPM_MAX_REQUESTS: "500"
  SECURE_COOKIES: "true"
  DEBUG: "false"

# Free-form additional env vars (e.g. plugin secrets).
# - name: SOMETHING
#   valueFrom:
#     secretKeyRef:
#       name: snappymail-secrets
#       key: something
extraEnv: []

# Reference whole ConfigMaps / Secrets as env sources.
# - secretRef:
#     name: snappymail-secrets
extraEnvFrom: []

# -----------------------------------------------------------------------------
# Probes — all hit the cheap /ping endpoint exposed by nginx.
# -----------------------------------------------------------------------------
probes:
  startup:
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    httpGet:
      path: /ping
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ping
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# -----------------------------------------------------------------------------
# HPA — note that SnappyMail isn't designed for clustered operation;
# autoscaling is only safe behind sticky-session affinity.
# -----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

# -----------------------------------------------------------------------------
# Pod disruption budget
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# -----------------------------------------------------------------------------
# Extra volumes / mounts (e.g. mount a ConfigMap with a custom plugin).
# -----------------------------------------------------------------------------
extraVolumes: []
extraVolumeMounts: []
