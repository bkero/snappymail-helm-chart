apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snappymail.fullname" . }}
  labels:
    {{- include "snappymail.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "snappymail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snappymail.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "snappymail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: snappymail
          image: {{ include "snappymail.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.admin.login }}
            - name: SNAPPYMAIL_ADMIN_LOGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # SnappyMail's data tree is bootstrapped fresh on every start
            # and overlaid from the ConfigMap/Secret mounts below.
            - name: data
              mountPath: /var/lib/snappymail
            # readOnlyRootFilesystem requires writable scratch space for the
            # bits the entrypoint, nginx, php-fpm and supervisor write to.
            - name: run
              mountPath: /run/snappymail
            - name: tmp
              mountPath: /tmp
            - name: nginx-tmp
              mountPath: /var/tmp/nginx
            - name: nginx-lib
              mountPath: /var/lib/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
            {{- if or .Values.config.applicationIni .Values.config.domains }}
            - name: overlay
              mountPath: /etc/snappymail-overlay
              readOnly: true
            {{- end }}
            {{- if or .Values.admin.password .Values.admin.existingSecret }}
            - name: admin-secret
              mountPath: /etc/snappymail-secret
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-lib
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-log
          emptyDir:
            sizeLimit: 16Mi
        {{- if or .Values.config.applicationIni .Values.config.domains }}
        - name: overlay
          configMap:
            name: {{ include "snappymail.fullname" . }}-overlay
            items:
              {{- if .Values.config.applicationIni }}
              - key: application.ini
                path: application.ini
              {{- end }}
              {{- range $name, $_ := .Values.config.domains }}
              - key: {{ printf "domain.%s.json" $name | quote }}
                path: {{ printf "domains/%s.json" $name | quote }}
              {{- end }}
        {{- end }}
        {{- if or .Values.admin.password .Values.admin.existingSecret }}
        - name: admin-secret
          secret:
            secretName: {{ if .Values.admin.existingSecret }}{{ .Values.admin.existingSecret }}{{ else }}{{ include "snappymail.fullname" . }}-admin{{ end }}
            items:
              - key: {{ .Values.admin.existingSecretKey | default "admin_password" }}
                path: admin_password
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
