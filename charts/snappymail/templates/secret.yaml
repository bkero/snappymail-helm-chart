{{/*
Optional Secret mounted at /etc/snappymail-secret in the pod.

Holds the cleartext admin password (key: admin_password). The container's
overlay step bcrypt-hashes it and writes it into application.ini at boot.

Skipped entirely when:
  - admin.password is empty (no password provided), or
  - admin.existingSecret is set (the user is bringing their own Secret).
*/}}
{{- if and .Values.admin.password (not .Values.admin.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snappymail.fullname" . }}-admin
  labels:
    {{- include "snappymail.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin_password: {{ .Values.admin.password | quote }}
{{- end }}
