apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "snappymail.fullname" . }}-test-connection"
  labels:
    {{- include "snappymail.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '--spider'
        - '-S'
        - '-T'
        - '5'
        - 'http://{{ include "snappymail.fullname" . }}:{{ .Values.service.port }}/ping'
