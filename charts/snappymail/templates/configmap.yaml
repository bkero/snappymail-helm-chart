{{/*
Overlay ConfigMap mounted into the pod at /etc/snappymail-overlay.

ConfigMap keys can't contain '/', so we use flat keys here and let the
deployment's `volumes[].configMap.items[]` block project them into the
right layout (application.ini at the root, each domain as
domains/<name>.json). The container's entrypoint then runs
snappymail-config-overlay.php to copy them into the data tree.

Rendered only when there is something to put in it.
*/}}
{{- if or .Values.config.applicationIni .Values.config.domains -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snappymail.fullname" . }}-overlay
  labels:
    {{- include "snappymail.labels" . | nindent 4 }}
data:
  {{- with .Values.config.applicationIni }}
  application.ini: |
    {{- . | nindent 4 }}
  {{- end }}
  {{/*
  Each domain entry is deep-merged with a stub Sieve block before being
  serialized. SnappyMail's Sieve\Settings::fromArray extends
  ConnectSettings::fromArray, which unconditionally reads `host` — so
  even when sieve is disabled the parser crashes if the Sieve dict is
  missing host/port/type. Stubbing them with localhost defaults lets
  the user supply just `Sieve: {enabled: false}` (or omit Sieve entirely)
  without hitting a "Cannot assign null to property ConnectSettings::$host"
  error at login. The user's values still win on conflict.
  */}}
  {{- $sieveDefaults := dict "host" "localhost" "port" 4190 "type" 0 "enabled" false }}
  {{- range $name, $body := .Values.config.domains }}
  {{- $merged := merge (deepCopy $body) (dict "Sieve" $sieveDefaults "whiteList" "") }}
  {{ printf "domain.%s.json" $name }}: |-
    {{- $merged | toJson | nindent 4 }}
  {{- end }}
{{- end }}
